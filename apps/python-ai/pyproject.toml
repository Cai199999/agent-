[project]
name = "agent-gongdan-python-ai"
version = "0.1.0"
description = "IT 运维工单智能 Agent - Python AI service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "langchain==1.5.0",
  "langgraph==1.2.22",
  "langchain-openai==1.8.0",
  "pymilvus==3.0.3",
  "milvus-lite==3.2.2",
  "httpx==0.28.1",
  "tenacity==9.2.1",
  "structlog==26.1.0",
  "python-multipart==0.0.34",
  "orjson==3.13.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "black==26.10.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "respx==0.23.1",
]

[tool.black]
line-length = 100
target-version = ["py313"]
